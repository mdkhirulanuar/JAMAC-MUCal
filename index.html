<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MU Calculator Pro - Energy Meter Calibration</title>
    <meta name="description" content="Kalkulator Measurement Uncertainty (MU) untuk Energy Meter Calibration. Manual step-by-step calculation mengikut ISO/IEC 17025.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="top-bar-left">
            <span class="logo">⚡</span>
            <span class="app-title">MU Calculator Pro</span>
            <span class="app-badge">ISO/IEC 17025</span>
        </div>
        <div class="top-bar-right">
            <button class="icon-btn" id="btn-save" title="Simpan">💾</button>
            <button class="icon-btn" id="btn-load" title="Muat">📂</button>
            <button class="icon-btn" id="btn-add-tab" title="Tambah Parameter">➕</button>
            <button class="icon-btn" id="btn-darkmode" title="Tema">🌙</button>
            <button class="icon-btn print-btn" id="btn-print" title="Cetak" onclick="window.print()">🖨️</button>
        </div>
    </header>

    <!-- Tab Bar -->
    <nav class="tab-bar" id="tab-bar"></nav>

    <!-- Tab Content -->
    <main class="tab-content" id="tab-content"></main>

    <!-- Footer -->
    <footer class="footer-main">
        <p>MU Calculator Pro v3.0 · Measurement Uncertainty for Energy Meter Calibration</p>
    </footer>

    <!-- Load Modal -->
    <div class="modal" id="load-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>📂 Muat Project</h3>
                <button class="modal-close" id="btn-load-cancel">✕</button>
            </div>
            <div class="modal-list" id="load-project-list"></div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
